# this file overrides some attributes in the the default compose.yaml file 
# to provide production specific attributes. For example, image attributes
# are used to overwrite the build attributes for services.

services:
  db:
    volumes:
      - type: bind
        source: /etc/docker/surl/db_init.sh
        target: /docker-entrypoint-initdb.d/db_init.sh
        read_only: true
  
  migration:
    volumes:
      - type: bind
        source: ./migrations/db_schema_${TAG}.sql
        target: /migration/db_schema.sql
        read_only: true
  api:
    image: shaobojiao/surl-api:${TAG}
  
  frontend:
    image: shaobojiao/surl-web:${TAG}