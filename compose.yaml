name: surl

services:
  db:
    image: postgres:18-bookworm
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password
    secrets:
      - postgres-password
      - surl-owner-password
      - surl-rw-password
    restart: always
    volumes:
      - type: volume
        source: db-data
        target: /var/lib/postgresql
      - type: bind
        source: ./env/db_init.sh
        target: /docker-entrypoint-initdb.d/db_init.sh
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER"]
      start_period: 30s
      start_interval: 3s
      interval: 1m
      timeout: 10s
      retries: 5
  
  migration:
    image: postgres:18-bookworm
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password
    secrets:
      - postgres-password
      - surl-owner-password
    restart: no
    volumes:
      - type: bind
        source: ./backend/Surl.Api/bin/db_schema.sql
        target: /migration/db_schema.sql
        read_only: true
    tmpfs:
      - /var/lib/postgresql
    command: /bin/bash -c "PGPASSWORD="$$(cat /run/secrets/surl-owner-password)" psql -h db -d surl -U surl_owner -f /migration/db_schema.sql"
    depends_on:
      db: 
        condition: service_healthy
        restart: false
  
  api:
    build: ./backend/Surl.Api/
    ports:
      - ${API_PORT:-6002}:8080
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=db;Database=surl;Username=surl_rw;
      - Secrets__DB_Default_Password_File=/run/secrets/surl-rw-password
      - Secrets_JWT_SECRET_FILE=/run/secrets/jwt-secret
    secrets:
      - surl-rw-password
      - jwt-secret
    depends_on:
      db:
        condition: service_healthy
        restart: true
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      start_period: 10s
      start_interval: 1s
      interval: 1m
      timeout: 10s
      retries: 5

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:${API_PORT:-6002}/api/short-urls
        - VITE_APP_URL=http://localhost:${FRONTEND_PORT:-6001}
    ports:
      - ${FRONTEND_PORT:-6001}:80
    restart: always
    
volumes:
  db-data:

secrets:
  postgres-password:
    file: ./secrets/postgres_password
  surl-owner-password:
    file: ./secrets/surl_owner_password
  surl-rw-password:
    file: ./secrets/surl_rw_password
  jwt-secret:
    file: ./secrets/jwt_secret
    