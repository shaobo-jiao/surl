server {
    listen              443 ssl;
    server_name         localhost;

    ssl_certificate     /certs/localhost.crt;
    ssl_certificate_key /certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root                /usr/share/nginx/surl;
    index               index.html;
    
    location / {
        try_files       $uri $uri/ /index.html;
    }
}